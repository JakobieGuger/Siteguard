site:
  name: "Capstone Site Demo"

messaging:
  zmq_pub_bind: "tcp://127.0.0.1:5556"
  zmq_sub_connect: "tcp://127.0.0.1:5556"

storage:
  sqlite_path: "/home/pi/Siteguard/safety-monitor/data/safety.db"
  retention_hours: 24

collector:
  publish_hz: 2
  timezone: "America/New_York"

sensors:
  weather_bme280:
    enabled: true
    i2c_bus: 1
    i2c_addr: 0x76
    period_s: 2

  anemometer:
    enabled: false
    gpio_pin: 17
    factor_mps_per_hz: 0.8
    sample_window_s: 2
    period_s: 2

  pir_motion:
    enabled: false
    gpio_pin: 27
    period_s: 1

  pm25:
    enabled: true
    port: "/dev/serial0"
    baudrate: 9600
    period_s: 2

  mic_noise:
    enabled: true
    gpio_pin: 4
    period_s: 0.2

rules:
  noise_dba_warning: 1
  noise_dba_critical: 1
  noise_duration_s: 1

  wind_gust_warning_mps
